name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: .NET SDK einrichten
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pakete wiederherstellen
        run: dotnet restore Cemaris.sln

      - name: Solution bauen
        run: dotnet build Cemaris.sln --configuration Release --no-restore

      - name: Tests ausführen
        run: dotnet test Cemaris.sln --configuration Release --no-build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Cemaris.Web
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Cemaris.Web/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Frontend prüfen
        run: npm run lint

      - name: Frontend bauen
        run: npm run build
