name: cemaris
services:
  migrate:
    image: cemaris-api:${CEMARIS_IMAGE_TAG:-0.2.0}
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["/app/.venv/bin/python", "/app/deploy/migrate.py"]
    environment:
      CEMARIS_DATABASE_URL: ${CEMARIS_DATABASE_URL:?Set CEMARIS_DATABASE_URL to a dedicated SQL Server application database}
    restart: "no"
    healthcheck:
      disable: true
  api:
    image: cemaris-api:${CEMARIS_IMAGE_TAG:-0.2.0}
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      TZ: ${CEMARIS_TIME_ZONE:-Europe/Berlin}
      CEMARIS_ENVIRONMENT: ${CEMARIS_ENVIRONMENT:-production}
      CEMARIS_LOG_LEVEL: ${CEMARIS_LOG_LEVEL:-info}
      CEMARIS_APP_URL: ${CEMARIS_APP_URL:-}
      CEMARIS_URL_PREFIX: ${CEMARIS_URL_PREFIX:-}
      CEMARIS_DATABASE_URL: ${CEMARIS_DATABASE_URL:?Set CEMARIS_DATABASE_URL to a dedicated SQL Server application database}
      CEMARIS_AUTH_TYPE: ${CEMARIS_AUTH_TYPE:-}
      CEMARIS_AUTH_CONFIG: ${CEMARIS_AUTH_CONFIG:-}
      CEMARIS_AUTH_DOMAIN: ${CEMARIS_AUTH_DOMAIN:-}
      CEMARIS_AUTH_COOKIE_NAME: ${CEMARIS_AUTH_COOKIE_NAME:-cemaris-user-sid}
      CEMARIS_AUTH_COOKIE_SECURE: ${CEMARIS_AUTH_COOKIE_SECURE:-true}
      CEMARIS_AUTH_SESSION_DIRECTORY: /app/data/sessions
      CEMARIS_AUTH_MAX_AGE_MILLIS: ${CEMARIS_AUTH_MAX_AGE_MILLIS:-3600000}
      CEMARIS_AUTH_DO_KEEP_ALIVE: ${CEMARIS_AUTH_DO_KEEP_ALIVE:-false}
      CEMARIS_AUTH_TRAFFIC_IS_FORWARDED: ${CEMARIS_AUTH_TRAFFIC_IS_FORWARDED:-true}
      CEMARIS_AUTH_DISABLE_RATE_LIMIT: ${CEMARIS_AUTH_DISABLE_RATE_LIMIT:-false}
      CEMARIS_AUTH_CAN_LOGIN: '${CEMARIS_AUTH_CAN_LOGIN:-["administrator"]}'
      CEMARIS_AUTH_CAN_UPDATE: '${CEMARIS_AUTH_CAN_UPDATE:-[]}'
      CEMARIS_AUTH_CAN_UPDATE_CEMETERIES: '${CEMARIS_AUTH_CAN_UPDATE_CEMETERIES:-[]}'
      CEMARIS_AUTH_CAN_UPDATE_CONTRACTS: '${CEMARIS_AUTH_CAN_UPDATE_CONTRACTS:-[]}'
      CEMARIS_AUTH_CAN_UPDATE_WORK_ORDERS: '${CEMARIS_AUTH_CAN_UPDATE_WORK_ORDERS:-[]}'
      CEMARIS_AUTH_IS_ADMIN: '${CEMARIS_AUTH_IS_ADMIN:-["administrator"]}'
      CEMARIS_AUDIT_LOG_ENABLED: ${CEMARIS_AUDIT_LOG_ENABLED:-false}
      CEMARIS_DISABLE_AUDIT_LOG: ${CEMARIS_DISABLE_AUDIT_LOG:-false}
      CEMARIS_RECORD_DELETE_AGE_DAYS: ${CEMARIS_RECORD_DELETE_AGE_DAYS:-60}
      CEMARIS_BACKUP_TASK_ENABLED: ${CEMARIS_BACKUP_TASK_ENABLED:-false}
      CEMARIS_BACKUP_HOUR: ${CEMARIS_BACKUP_HOUR:-2}
      CEMARIS_BACKUP_DELETE_AGE_DAYS: ${CEMARIS_BACKUP_DELETE_AGE_DAYS:-0}
      CEMARIS_BACKUP_DIRECTORY: ${CEMARIS_BACKUP_DIRECTORY:-}
      CEMARIS_BACKUP_LOCAL_DIRECTORY: ${CEMARIS_BACKUP_LOCAL_DIRECTORY:-}
      CEMARIS_CONTRACT_PRINTS: '${CEMARIS_CONTRACT_PRINTS:-["screen/contract"]}'
      CEMARIS_CUSTOM_PDF_PRINT_TITLES: ${CEMARIS_CUSTOM_PDF_PRINT_TITLES:-}
      CEMARIS_FEE_TAX_PERCENTAGE_DEFAULT: ${CEMARIS_FEE_TAX_PERCENTAGE_DEFAULT:-0}
      CEMARIS_BURIAL_SITE_NAME_SEGMENTS: ${CEMARIS_BURIAL_SITE_NAME_SEGMENTS:-}
      CEMARIS_CUSTOMIZATIONS_PATH: /app/customizations
      CEMARIS_BURIAL_SITE_REFRESH_IMAGE_CHANGES: ${CEMARIS_BURIAL_SITE_REFRESH_IMAGE_CHANGES:-false}
      CEMARIS_CEMETERY_REFRESH_IMAGE_CHANGES: ${CEMARIS_CEMETERY_REFRESH_IMAGE_CHANGES:-false}
      CEMARIS_LATITUDE_MIN: ${CEMARIS_LATITUDE_MIN:--90}
      CEMARIS_LATITUDE_MAX: ${CEMARIS_LATITUDE_MAX:-90}
      CEMARIS_LONGITUDE_MIN: ${CEMARIS_LONGITUDE_MIN:--180}
      CEMARIS_LONGITUDE_MAX: ${CEMARIS_LONGITUDE_MAX:-180}
      CEMARIS_ADDRESS_LABELS: ${CEMARIS_ADDRESS_LABELS:-de}
      CEMARIS_CONTRACT_END_DATE_IS_AVAILABLE: ${CEMARIS_CONTRACT_END_DATE_IS_AVAILABLE:-true}
      CEMARIS_CONTRACT_NUMBER_LENGTH: ${CEMARIS_CONTRACT_NUMBER_LENGTH:-10}
      CEMARIS_CONTRACT_BURIAL_SITE_ID_IS_REQUIRED: ${CEMARIS_CONTRACT_BURIAL_SITE_ID_IS_REQUIRED:-true}
      CEMARIS_CONTRACT_END_DATE_IS_REQUIRED: ${CEMARIS_CONTRACT_END_DATE_IS_REQUIRED:-false}
      CEMARIS_WORK_ORDER_NUMBER_LENGTH: ${CEMARIS_WORK_ORDER_NUMBER_LENGTH:-6}
      CEMARIS_WORK_ORDER_CALENDAR_EMAIL_ADDRESS: ${CEMARIS_WORK_ORDER_CALENDAR_EMAIL_ADDRESS:-no-reply@127.0.0.1}
      CEMARIS_WORK_ORDER_CALENDAR_PRINTS: ${CEMARIS_WORK_ORDER_CALENDAR_PRINTS:-}
      CEMARIS_ATTACHMENTS_PATH: /app/data/attachments
      CEMARIS_MAX_ATTACHMENT_FILE_SIZE: ${CEMARIS_MAX_ATTACHMENT_FILE_SIZE:-20}
      CEMARIS_PRINT_CONTENT_DISPOSITION: ${CEMARIS_PRINT_CONTENT_DISPOSITION:-attachment}
      CEMARIS_PRINT_BROWSER: ${CEMARIS_PRINT_BROWSER:-chrome}
      CEMARIS_PRINT_BROWSER_EXECUTABLE: ${CEMARIS_PRINT_BROWSER_EXECUTABLE:-/usr/bin/chromium}
      CEMARIS_PRINT_CONFIGURATION: ${CEMARIS_PRINT_CONFIGURATION:-}
    volumes:
      - sessions:/app/data/sessions
      - attachments:/app/data/attachments
      - ${CEMARIS_CUSTOMIZATIONS_HOST_PATH:-./customizations}:/app/customizations:ro
    restart: unless-stopped
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 370s
  web:
    image: cemaris-web:${CEMARIS_IMAGE_TAG:-0.2.0}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        CEMARIS_URL_PREFIX: ${CEMARIS_URL_PREFIX:-}
    environment:
      CEMARIS_TRUSTED_PROXY_CIDR: ${CEMARIS_TRUSTED_PROXY_CIDR:-127.0.0.1}
    ports:
      - "127.0.0.1:${CEMARIS_WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sessions:
  attachments:
