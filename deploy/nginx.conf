server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    # The outer HTTPS proxy replaces X-Real-IP. Trust only its actual address.
    set_real_ip_from ${CEMARIS_TRUSTED_PROXY_CIDR};
    real_ip_header X-Real-IP;
    real_ip_recursive off;
    # CSV/iCal legacy routes include API keys; do not record complete URLs.
    access_log off;
    # The API enforces the configured file limit, including chunked requests.
    client_max_body_size 0;

    # CEMARIS_PREFIX_RULES

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Keep API misses as JSON errors; never serve index.html for an API URL.
    location = /api {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    # Signing initialization renders PDFs and calls the provider before replying.
    location = /api/admin/doBackupDatabase {
        proxy_pass http://api:8000;
        proxy_read_timeout 370s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /api/contracts/consigno-cloud/start {
        proxy_pass http://api:8000;
        proxy_read_timeout 180s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    # Legacy signing/GP lookups can perform multiple bounded provider operations.
    location ~ ^/contracts/do(GetContractDetailsForConsignoCloud|StartConsignoCloudWorkflow|GetDynamicsGPDocument)$ {
        proxy_pass http://api:8000;
        proxy_read_timeout 180s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /print/ {
        proxy_pass http://api:8000;
        proxy_read_timeout 120s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    # The report library itself is React; named legacy URLs return CSV.
    location ~ ^/reports/[^/]+/?$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /public-internal/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /assets/ {
        try_files $uri =404;
    }
    location /branding/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
